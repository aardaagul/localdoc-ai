# LocalDoc AI - Uygulamayı tek komutla ayağa kaldırır (Ollama + Backend + Arayüz).
#
# NOT: Modelleri ilk kez indirmek için, konteynerler açıldıktan sonra:
#   docker compose exec ollama ollama pull llama3.2
#   docker compose exec ollama ollama pull nomic-embed-text

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      DATABASE_URL: sqlite:////app/data/localdoc.db
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: "*"
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  ollama_data:
  backend_data:
